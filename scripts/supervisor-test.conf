; Minimal supervisor config fixture for Linux smoke (syntactic parse check only).
; Mirrors the shape of a production deployment section: absolute command/directory,
; explicit env, stopasgroup/killasgroup, separate stdout/stderr logs.
; Replace the deployment root below with your real path before use.
[program:daily-checkin]
command=/REPLACE_WITH_DEPLOY_ROOT/daily-checkin/.venv/bin/python /REPLACE_WITH_DEPLOY_ROOT/daily-checkin/app/stealth_checkin_runner.py --source cron
directory=/REPLACE_WITH_DEPLOY_ROOT/daily-checkin/app
autostart=true
autorestart=true
startsecs=5
startretries=100
stopasgroup=true
killasgroup=true
stdout_logfile=/REPLACE_WITH_DEPLOY_ROOT/daily-checkin/logs/runner.out.log
stderr_logfile=/REPLACE_WITH_DEPLOY_ROOT/daily-checkin/logs/runner.err.log
environment=DAILY_CHECKIN_DB="/REPLACE_WITH_DEPLOY_ROOT/daily-checkin/data/system.db",DAILY_CHECKIN_LOG_DIR="/REPLACE_WITH_DEPLOY_ROOT/daily-checkin/logs",CDP_HTTP="http://127.0.0.1:9333"