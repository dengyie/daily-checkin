    url: https://api.guxiaomo.site/wallet
    kind: browser
    prefer_catalog_url: true
    signs:
      - 'button:has-text("立即签到")'
      - 'button:has-text("签到")'
    # 「每日仅可签到一次」是站点常驻说明文案,未签到页也有,绝不能当已签(2026-09-02
    # 实测:未签页有可点「立即签到」+静态说明,当月累计 $0;只有「今日已签到/签到成功」
    # 才算已签,否则假 ALREADY 跳过真实签到)。
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
  # yeelo(img.yeelo.fun):登录后落在 /admin/user-info,页面有可点的「今日签到」
  # 按钮,已签后文案变「今天已签到，明天再来领取」。「已签到 N 天」是本月统计,
  # 不是当日已签。dedicated adapter 让 CTA/确认态精确命中。
  - name: 'yeelo'
    url: https://img.yeelo.fun/admin/user-info
    kind: browser
    prefer_catalog_url: true
    signs:
      - 'button:has-text("今日签到")'
      - 'button:has-text("签到")'
    already:
      - 'text=今天已签到'
      - 'text=签到成功'
      - 'text=今日已签到'
  # columbina(newapi.columbina.eu.org):New API 系,密码框 input[name=password]
  # type=text,凭据登录后 /profile 显示「每日签到 已签到 今天 +$X」→ 登录即签到。
  - name: 'columbina'
    url: https://newapi.columbina.eu.org/profile
    kind: browser
    prefer_catalog_url: true
    signs:
      - 'button:has-text("立即签到")'
      - 'button:has-text("签到")'
      - 'button:has-text("今日签到")'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=已签到'
      - 'text=今天已签到'
  # gemai(api.gemai.cc, 哈基米API站):New API 系账密登录站,真登录卡在 /sign-in
  # (/login 直接 404),账号 input[name=username]+密码 input[name=password]
  # type=password,含 legal 条款 checkbox。绑定真账密走 _ensure_account_logged_in
  # (login_url override 到 /sign-in),登录后 /profile 判定签到态。
  - name: 'gemai'
    url: https://api.gemai.cc/profile
    kind: browser
    prefer_catalog_url: true
    login_url: https://api.gemai.cc/sign-in
    signs:
      - 'button:has-text("立即签到")'
      - 'button:has-text("签到")'
      - 'button:has-text("今日签到")'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=已签到'
      - 'text=今天已签到'
  # helpcoder(helpcoder.cc, 帮帮程序员):New API 系(页脚「设计与开发由 New API」),
  # 纯账密登录站,登录卡在 /login(「用户名或邮箱/密码/继续」,无 OAuth)。绑定真账密
  # 走 _ensure_account_logged_in(默认派生 /login 即可)。登录后 /console/personal 判定签到态。
  - name: 'helpcoder'
    url: https://helpcoder.cc/console/personal
    kind: browser
    prefer_catalog_url: true
    signs:
      - 'button:has-text("立即签到")'
      - 'button:has-text("签到")'
      - 'button:has-text("今日签到")'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=已签到'
      - 'text=今天已签到'
  # hcnsec(api.hcnsec.cn, 新疆幻城网安科技公益大模型API网关):New API 系
  # (真实登录后落 /dashboard/overview,非 /console/personal——该路径 SPA 404
  # shell「糟糕 页面未找到」)。纯账密登录站,登录卡在 /sign-in(/login 404),
  # username/password + legal-consent 条款 checkbox(不勾则登录 submit disabled,
  # 且只能 JS click 原生 checkbox 才能解除——label.click 不触发 React 状态)。
  # 绑定真账密走 _ensure_account_logged_in + login_url override 到 /sign-in。
  - name: 'hcnsec'
    url: https://api.hcnsec.cn/dashboard/overview
    kind: browser
    prefer_catalog_url: true
    login_url: https://api.hcnsec.cn/sign-in
    # 无签到按钮(登录后 dashboard 无 CTA),后端 POST /api/user/checkin 消费签到,
    # 需带 localStorage uid 的自定义身份头。改走 signin_api(uid header 版)。
    signin_api: /api/user/checkin
    signin_api_uid_header: true
    signs:
      - 'button:has-text("签到")'
      - 'button:has-text("立即签到")'
      - 'button:has-text("今日签到")'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=已签到'
      - 'text=今天已签到'
