# sites.yaml — daily-checkin site catalog
# Keys: signs / already map to SiteAdapter sign_selectors / already_selectors.

sites:
  - name: 'fengwind'
    url: https://api-welfalre.fengwind.com/
    kind: browser
    signs:
      - 'button[data-slot="button"]:has-text("签到")'
      - 'button.bg-primary:has-text("签到")'
      - 'button:not([role="tab"]):has-text("签到")'
      - 'button:has-text("签到")'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=已签到'
  - name: '薄荷公益站'
    url: https://up.x666.me/
    kind: bohe
    signs:
      - 'button:has-text("开始转动")'
      - 'button:has-text("转动")'
      - 'text=开始转动'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=今日已签'
  - name: '小鸡毛'
    url: https://game.ark717.com/
    kind: arkengine
    signs:
      - 'button:has-text("签到")'
      - '#checkinBtn'
    already:
      - 'text=今日已签到'
      - 'text=已签到'
      - 'text=签到成功'
