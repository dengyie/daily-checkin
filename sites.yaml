      - 'text=今日已签'
  # gorouter.app(GoRouter, New API 系):GitHub OAuth 登录即签到,无签到按钮。
  # 单账号,专属 gorouter_checkin 流程按 kind 分发。
  - name: 'gorouter'
    url: https://gorouter.app/
    kind: gorouter
    enabled: true
    provider: gorouter
    signs:
