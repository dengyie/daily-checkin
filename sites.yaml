  # pool(pool.983698.xyz, 983698 公益池)—— 2026-09-20 接入。
  # 2026-10-01 站点改版:每日签到从「商店」Tab 迁移至「我的信息」Tab
  # (商店 Tab 面板已变为「兑换邀请码」,消耗积分,绝不可点)。
  # pool_checkin 专属流程:点「我的信息」→「立即签到」(文案锚定,严防误触兑换)。
  - name: 'pool'
    url: https://pool.983698.xyz/
    kind: pool
    prefer_catalog_url: true
    signs:
      - 'button.primary:has-text("立即签到")'
      - 'button:has-text("立即签到")'
    already:
      - 'button.primary:has-text("今日已签到")'
      - 'button:has-text("今日已签到")'
      - 'text=今日已签到'
      - 'text=签到成功'
  # sub2api(sub2api.0api.cc.cd Sub2API 站)—— 2026-09-25 接入。纯账号密码登录
  # (在 签到公益站账密.md 注册)。
  # 签到从旧 /profile 迁移至 /custom/activity 的 operations-ui iframe 中。
  # 走专属 sub2api_checkin 流程:进入 /custom/activity → 定位 iframe → 点击 #checkin「立即签到」+ 确认门。
  - name: 'sub2api'
    url: https://sub2api.0api.cc.cd/custom/activity
    kind: sub2api
    prefer_catalog_url: true
    login_url: https://sub2api.0api.cc.cd/login
    signs:
      - '#checkin'
      - 'button:has-text("立即签到")'
    already:
      - '#checkin-badge:has-text("今日已签")'
      - 'text=今日已签到'
      - 'text=今天已经签到过了'
      - 'text=签到成功'
  # dygyz(dygyz.pmcat.top, PM订阅公益站)—— 2026-09-25 接入。
  # LinuxDo OAuth 登录(复用 9222 共享 profile 的 mango 会话)。
  # 签到入口位于 /dashboard 的「每日签到」卡片,表单 POST /checkin。
  # 走 browser 流程:未签点击「立即签到领流量」按钮,已签显示 .checkin-done / .flash-ok。
  - name: 'dygyz'
    url: https://dygyz.pmcat.top/dashboard
    kind: browser
    prefer_catalog_url: true
    login_url: https://dygyz.pmcat.top/login
    signs:
      - 'button:has-text("立即签到领流量")'
      - 'button:has-text("立即签到")'
      - 'form[action="/checkin"] button'
    already:
      - '.checkin-done'
      - '.flash-ok'
      - 'text=今日已签'
      - 'text=今日已签到'
      - 'text=今天已经签到过了'
      - 'text=签到成功'
  # glados(glados.rocks/console/checkin, GLaDOS 控制台每日签到)—— 2026-09-30 接入。
  # 复用 9222 共享 profile 的 gld:sess 会话 Cookie，严守 P0 禁止全清 Cookie。
  # 注意：Daily Punch 卡片日历图例常驻 "Checked in" / "Missed" 文案，不可用泛文本判已签；
  # 专属 glados_checkin 流程通过 /api/user/points + button.checkin-cute-btn 精确点击与校验。
  - name: 'glados'
    url: https://glados.rocks/console/checkin
    kind: glados
    prefer_catalog_url: true
    login_url: https://glados.rocks/login
    signs:
      - 'button.checkin-cute-btn:not(.is-done)'
      - 'button.checkin-cute-btn:has-text("签到")'
      - 'button.checkin-cute-btn:has-text("Checkin")'
    already:
      - 'button.checkin-cute-btn.is-done'
      - 'text=Checkin! Got'
      - 'text=Return tomorrow'
      - 'text=Please Try Tomorrow'
  # yunzhi(yunzhi.play.cn/ai 云智手机「今日登录福利」,赠 2 天云机空间权益)—— 2026-10-01 接入。
  # 纯 RPC 流程(2026-10-01 抓包逆向):9222 页面内 fetch 调 yunzhi.new-gm.cn API,
  # HMAC-SHA256 头签名(/yunzhi+path,盐 8822FF81...) + MD5 体签名(盐 7f9e2d08...);
  # 流程: home-popups/init → {popupId}/claim → benefit/user/benefit(158) 取 userItems
  # + 运行中云机(status=2) → benefit/claim → 轮询 claim/status 至 status=1。
  # 登录态: localStorage cloud_phone_token / Cookie CG_CLINET_USER_TOKEN_YUN。
  # 严禁 clear_cookies;直连 urllib 会被 WAF 503,必须页面内 fetch。
  - name: 'yunzhi'
    url: https://yunzhi.play.cn/ai/?channel_code=00000042
    kind: yunzhi
    prefer_catalog_url: true
    login_url: https://yunzhi.play.cn/ai/#/login
    signs:
      - 'text=开心收下'
      - 'text=立即领取'
    already:
      - 'text=今日已领取'
      - 'text=明天再来'
  # yunzhi_win (云智手机账号2: 台式机账号 Token 独立签到与云机空间领取)—— 2026-10-03 接入。
  # 独立 Token 凭据驱动(~/.config/daily-checkin/credentials/yunzhi_win.json);
  # 经由 9222 页面内 fetch 发起纯 RPC 请求,不碰 9222 的主账号 localStorage/Cookie,支持自动续期回写。
  - name: 'yunzhi_win'
    url: https://yunzhi.play.cn/ai/?channel_code=00000042
    kind: yunzhi
    prefer_catalog_url: true
    login_url: https://yunzhi.play.cn/ai/#/login
    signs:
      - 'text=开心收下'
      - 'text=立即领取'
    already:
      - 'text=今日已领取'
      - 'text=明天再来'


