  # ultrarouter.org(Ultra Router · 艺の公益站):New API 克隆。
  # 2026-09 GitHub OAuth 被站方移除(/sign-in 只剩「使用 LinuxDo 继续」, 所以改为
  # 单账号 LinuxDo -> yourhandle 签到)。专属 ultrarouter_checkin 流程按 kind 分发。
  # 登出只清本域 session cookie(P0 红线,见运维手册「P0:共享 9222 profile 的
  # Cookie 全清禁令」)。
  - name: 'ultrarouter'
