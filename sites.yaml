  # agentrouter.org:签到须先登出再重新登录才触发。双账号(GitHub + Linux.do OAuth)
  # 由专属 agentrouter_checkin 流程处理,不挂账密凭据(登录态在 staging Chrome profile)。
  - name: 'agentrouter'
    url: https://agentrouter.org/
    kind: agentrouter
    enabled: true
    provider: agentrouter
    signs:
      - 'button:has-text("签到")'
      - 'button:has-text("今日签到")'
      - 'button:has-text("立即签到")'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=今日已签'
      - 'text=已经签到'
  # tabitoken.com(TaBiAI / New API 系):同 agentrouter,登录即触发额度,无签到按钮/文字。
  # 单账号(仅 GitHub OAuth),由专属 tabitoken_checkin 流程处理(清 session cookie
  # 再 GitHub 登录);不挂账密凭据(登录态在 staging Chrome profile)。
  - name: 'tabitoken'
    url: https://tabitoken.com/
    kind: tabitoken
    enabled: true
    provider: tabitoken
    signs:
      - 'button:has-text("签到")'
      - 'button:has-text("今日签到")'
      - 'button:has-text("立即签到")'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=今日已签'
      - 'text=已经签到'
  # justwoker(api.justwoker.icu, JustDoWork):New API 系,签到机制=GitHub OAuth
  # 登录即触发额度,无签到按钮/确认文字。单账号(仅 GitHub OAuth),登录态在 staging
  # Chrome profile。专属 justwoker_checkin 流程(清 session → /sign-in → GitHub OAuth
  # 回跳即签到 OK)按 kind 分发。
  - name: 'justwoker'
    url: https://api.justwoker.icu/
    kind: justwoker
    enabled: true
