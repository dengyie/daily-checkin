    url: https://free.lyclaude.site/console/personal
    kind: newapi_profile
  - name: 'ai.52ccl.cn'
    url: https://52ccl.net/profile
    kind: newapi_profile
    prefer_catalog_url: true
  - name: 'muyuan'
    url: https://muyuan.do/console/personal
    kind: newapi_profile
  - name: '42'
    url: https://api.42w.shop/profile
    kind: newapi_profile
  - name: 'jiuitj'
    url: https://jiuuij.de5.net/console/personal
    kind: newapi_profile
  - name: 'afsmc'
    url: https://api.afsmc.cn/profile
    kind: newapi_profile
  # zmingu(New API 网关):9222 共享 profile 已用 Linux.do 账号登录,无 OAuth 重登,
  # 走标准 newapi_profile 流程:进 /profile 点「立即签到」+ 确认门。
  - name: 'zmingu'
    url: https://api.zmingu.app/profile
    kind: newapi_profile
  # minimax(johntime New API 站):LinuxDo OAuth 登录(linuxdo_oauth=true,
  # checkin_enabled=true,无 turnstile),走标准 newapi_profile 流程:
  # /profile → 未登录自动 LinuxDo SSO(共享 9222 profile)→ 点「立即签到」。
  - name: 'minimax'
    url: https://minimax.johntime.top/profile
    kind: newapi_profile
  # luckyg(131518.xyz New API 站):LinuxDo OAuth 登录(linuxdo_oauth=true,
  # checkin_enabled=true),签到接口挂 turnstile 人机验证(token 自动就绪后才点
  # CTA,wait_turnstile_token 内置处理),走标准 newapi_profile 流程。
  - name: 'luckyg'
    url: https://luckyg.131518.xyz/profile
    kind: newapi_profile
  # bxacc(api.bxacc.xyz / 方舟 New API)—— 2026-09-20 接入。LinuxDo OAuth 登录
  # (linuxdo_oauth=true, github_oauth=false, checkin_enabled=true),签到接口挂
  # turnstile(turnstile_check=true,token 自动就绪后才点 CTA,wait_turnstile_token
  # 内置处理),走标准 newapi_profile 流程:/profile → 点「立即签到」。
  # 常驻说明「每日仅可签到一次，请勿重复签到」绝不能当已签(同 guxiaomo/mzlone)。
  # 9222 共享 profile 已登录 mangoqwq。P0:禁止全清 Cookie。
  - name: 'bxacc'
    url: https://api.bxacc.xyz/profile
    kind: newapi_profile
    prefer_catalog_url: true
  # techmob(newapi.do.techmob.net New API 站)—— 2026-09-22 接入。标准 LinuxDo OAuth
  # 登录(共享 9222 profile 已登录 mangoqwq),走标准 newapi_profile 流程:
  # /profile → 点「立即签到」+ 确认门。
  # 常驻说明「每日仅可签到一次，请勿重复签到」绝不能当已签。
  - name: 'techmob'
    url: https://newapi.do.techmob.net/profile
    kind: newapi_profile
    prefer_catalog_url: true
  # 0api(0api.cc.cd / 原 newapi.0api.cc.cd 308 重定向至 sub2api.0api.cc.cd)—— 2026-09-23 接入，2026-09-25 迁移。
  # 纯账号密码登录(在 签到公益站账密.md 注册)。站方全站迁移且前台重构，签到从 /profile 迁移至
  # /custom/activity 的 operations-ui iframe 中。
  # 走专属 sub2api_checkin 流程:进入 /custom/activity → 定位 iframe → 点击 #checkin「立即签到」+ 确认门。
  - name: '0api'
    url: https://sub2api.0api.cc.cd/custom/activity
    kind: sub2api
    prefer_catalog_url: true
    login_url: https://sub2api.0api.cc.cd/login
    signs:
      - '#checkin'
      - 'button:has-text("立即签到")'
    already:
      - '#checkin-badge:has-text("今日已签")'
      - 'text=今日已签到'
      - 'text=今天已经签到过了'
      - 'text=签到成功'
  # happycoding(happycoding.xyz New API 站)—— 2026-09-24 接入。标准 LinuxDo OAuth
  # 登录(共享 9222 profile 已登录 mangoqwq),走标准 newapi_profile 流程:
  # /profile → 点「立即签到」+ 确认门。
  # 常驻说明「每日仅可签到一次，请勿重复签到」绝不能当已签。
  - name: 'happycoding'
    url: https://happycoding.xyz/profile
    kind: newapi_profile
    prefer_catalog_url: true
  # nailao(nailao.biz, 奶酪公益站)—— 2026-09-28 接入。标准 New API 站点 (sha-779b233de21c),
  # 账密登录站(在 签到公益站账密.md 注册),未登录时自动去 /sign-in 执行账密登录。
  # 走标准 newapi_profile 流程: /profile → 点击「立即签到」+ 确认门。
  # 严格遵守 P0: 复用当前调试 profile 会话，禁止全清 Cookie。
  - name: 'nailao'
    url: https://nailao.biz/profile
    kind: newapi_profile
    prefer_catalog_url: true
    login_url: https://nailao.biz/sign-in
  # abnt(api.abnt.it New API 站):LinuxDo OAuth 登录(linuxdo_oauth2=true,
  # checkin_enabled=true,无 turnstile),走尊属 abnt_checkin:
  # /sign-in → LinuxDo SSO(OAuth 回跳落新 tab,适配器接管带登录态 /profile)
  # → 点「立即签到」+ 确认门。
  - name: 'hkai25'
    url: https://share.hkai25.top/profile
    kind: newapi_profile
