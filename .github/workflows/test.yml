name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m py_compile \
            stealth_checkin_runner.py \
            scripts/daily-checkin-cron.py \
            checkin_core/*.py \
            checkin_core/providers/*.py \
            tests/*.py

      - name: Run full pytest suite (xdist parallel, per-test watchdog)
        # Single canonical runner: runner adapter/flow tests + system/store/web
        # + ops-script contracts. -n auto parallelizes across worker processes;
        # pytest-timeout (pyproject) fails a hung test in 120s instead of
        # burning the job timeout.
        run: python -m pytest tests/ -q -n auto

      - name: Validate frontend and shell entry
        run: |
          node --check web/app.js
          bash -n scripts/daily-checkin-cdp.sh
          bash -n scripts/linux-smoke.sh
          git diff --check

  linux-smoke:
    # Linux portability gate: credential backend + supervisor + WAL/flock on a
    # non-macOS host. Never runs real sites or launches a browser.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Linux portability smoke
        run: bash scripts/linux-smoke.sh
      - name: Run credential backend unit tests on Linux
        run: python -m unittest tests.test_system_store_web.FileCredentialsTests tests.test_system_store_web.CredentialStoreFactoryTests -v

  windows-smoke:
    # Windows portability gate: syntax compile + core unit tests on a Windows
    # runner. Catches Windows-specific issues (path separators, file locking,
    # encoding) before they hit the home-win deployment. Never runs real sites
    # or launches a browser.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-xdist pytest-timeout
      - name: Compile Python on Windows
        run: |
          python -c "import pathlib, py_compile; files = [pathlib.Path('stealth_checkin_runner.py'), pathlib.Path('scripts/daily-checkin-cron.py'), *pathlib.Path('checkin_core').rglob('*.py'), *pathlib.Path('tests').rglob('*.py')]; [py_compile.compile(str(path), doraise=True) for path in files]"
      - name: Run unit tests on Windows
        # Runner site-flow tests historically validated on macOS only; keep
        # the Windows gate at the system/store/web + ops-contract layer.
        run: python -m pytest tests/ -q -n auto -m "not runner" --tb=short
      - name: Validate batch scripts
        run: |
          python -c "
          import pathlib, sys
          for f in ['scripts/start-all-win.bat', 'scripts/run-checkin-win.bat']:
              p = pathlib.Path(f)
              if not p.exists():
                  print(f'WARN: {f} not found, skipping')
                  continue
              content = p.read_text(encoding='utf-8', errors='replace')
              if not content.strip():
                  print(f'FAIL: {f} is empty')
                  sys.exit(1)
              print(f'{f}: {len(content)} bytes, ok')
          "
