      - 'text=签到成功'
  # nexavlinks.com(NexaVlinks 聚合 / New API 系 AI 聚合站)—— 2026-09-11 拆成
  # 两个独立单账号任务(不再双账号聚合轮换):
  #   ① nexavlinks-linuxdo  → Linux.do OAuth 单账号(复用 9222 共享 profile 的
  #                            linux.do 会话,名字含 linuxdo → nexa_linuxdo_checkin)。
  #   ② nexavlinks-email    → 邮箱+密码单账号(账号密码从 accounts 文件按站名读取,
