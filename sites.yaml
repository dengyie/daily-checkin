      - 'button:has-text("签到领取奖励")'
      - 'button:has-text("今日签到")'
    already:
      - 'text=今日已签到'
      - 'text=签到成功'
      - 'text=今日已签'
      - 'button:has-text("已签到")'
      - 'button:has-text("今日已签到")'
  # zero.cat(ZeroCat):QuantumNous 模板站,LinuxDo OAuth 登录(共享 9222
  # profile 的 Linux.do 会话),走标准 maybe_sso_if_needed → try_linuxdo_sso
  # 流程。签到页 /checkin,按钮 「立即签到 」(Check in now),成功回执
  # 「签到成功！获得…」,已签状态「已签到 / Checked in」。
  - name: 'zerocat'
    url: https://zero.cat/checkin
    kind: browser
    signs:
      - 'button:has-text("立即签到")'
      - 'button:has-text("Check in now")'
      - 'button:has-text("签到")'
    already:
      - 'text=签到成功'
      - 'text=已签到'
      - 'button:has-text("已签到")'
      - 'text=Checked in'
      - 'button:has-text("Checked in")'
  # fluxionai.space(Fluxion AI / 流元AI):Sub2API 系福利站(非 New API),
