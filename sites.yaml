    kind: newapi_profile
  # feixingwawa(newapi.feixingwawa.cn, 蛙蛙公益站new)—— 2026-10-01 接入。
  # 标准 LinuxDO OAuth + newapi_profile,checkin_enabled=true、无 Turnstile(2026-10-01 /api/status 实测)。
  - name: 'feixingwawa'
    url: https://newapi.feixingwawa.cn/profile
    kind: newapi_profile
  # wududu(wududu.edu.kg, dudu公益站)—— 2026-10-02 接入。
  # 标准 LinuxDO OAuth + newapi_profile,checkin_enabled=true、无 Turnstile(2026-10-02 /api/status 实测)。
  - name: 'wududu'
    url: https://wududu.edu.kg/profile
    kind: newapi_profile
  # mailhub(mailhub.pigeonw.com, Mailhub 邮箱额度站)—— 2026-10-01 接入。
  # 非 New API:钱包页 POST /wallet/checkin(表单 csrf)。同页另有「兑换」按钮,
  # 选择器必须钉死 button.primary「立即签到」,不能用裸「签到」。
  # 登录默认 LinuxDO,本次不测登录;已登录页有「退出登录」,通用流程不会去点 SSO。
  - name: 'mailhub'
    url: https://mailhub.pigeonw.com/wallet
